<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Offline - StocksDeepDive</title>
<meta name="theme-color" content="#0b1220">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;padding-top:calc(24px + env(safe-area-inset-top));
    background:#0b1220;color:#e6edf5;
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
  .card{max-width:420px;width:100%;background:#121f36;border:1px solid #1f3352;
    border-radius:14px;padding:28px 26px;text-align:center}
  .logo{font-size:20px;font-weight:800;margin-bottom:14px}
  .logo .accent{color:#2dd4bf}
  h1{font-size:19px;margin:0 0 10px;font-weight:700}
  p{margin:0;color:#8aa0b8;font-size:14.5px;line-height:1.55}
  button{margin-top:20px;background:rgba(45,212,191,.07);border:1.5px solid #2dd4bf;
    color:#2dd4bf;border-radius:10px;padding:10px 20px;font-weight:600;font-size:14.5px;
    cursor:pointer;font-family:inherit}
  button:hover{background:#2dd4bf;color:#fff}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Stocks<span class="accent">DeepDive</span></div>
    <h1>You're offline</h1>
    <p>StocksDeepDive needs a connection for live data. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
